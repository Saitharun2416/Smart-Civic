name: Deploy and E2E Test Website

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Website to gh-pages Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Clone gh-pages branch or create it if not exists
          git clone --single-branch --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-dir || {
            echo "gh-pages branch doesn't exist, creating new one..."
            mkdir gh-pages-dir
            cd gh-pages-dir
            git init
            git checkout -b gh-pages
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            cd ..
          }
          
          # Copy static website files to the root of the Pages directory
          cp -r web/* gh-pages-dir/
          
          # Commit and Push to gh-pages branch
          cd gh-pages-dir
          git add -A
          git commit -m "Deploy website dashboard to GitHub Pages" || echo "No changes to commit"
          git push origin gh-pages
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Install Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Verify Live Deployment URL
        run: |
          DEPLOY_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Verifying live URL: $DEPLOY_URL"
          
          # Poll the URL until HTTP 200 is returned (up to 3 minutes)
          timeout=180
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "URL is live (HTTP 200)!"
              break
            fi
            echo "Waiting for deployment... Current Status: $STATUS (Elapsed: ${elapsed}s)"
            sleep 10
            elapsed=$((elapsed + 10))
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "Warning: Deployment verification timed out. Attempting to run tests anyway."
          fi

      - name: Run Selenium E2E Tests
        env:
          BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          python -m pytest tests/selenium/test_flow.py -v

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Report
          path: |
            Test Results/Excel/Automation_Test_Report.xlsx
            Test Results/HTML/execution-report.html
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/Summary/summary.md

      - name: Publish Job Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "# Execution Failed" >> $GITHUB_STEP_SUMMARY
            echo "Test suite failed before generating reports." >> $GITHUB_STEP_SUMMARY
          fi
