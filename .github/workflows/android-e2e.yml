name: Android E2E Appium Testing & Report Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-test:
    runs-on: ubuntu-latest # ubuntu-latest has hardware acceleration and fast spin-up
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Install Node.js & Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-spellchecker: true
          script: chmod +x scripts/run-e2e-tests.sh && ./scripts/run-e2e-tests.sh

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Report
          path: |
            Test Results/Excel/Test_Report.xlsx
            Test Results/Excel/Backend_Test_Report.xlsx
            Test Results/HTML/execution-report.html
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/Summary/summary.md

      - name: Deploy Reports to GitHub Pages Branch
        if: always()
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Clone gh-pages branch or create it if not exists
          git clone --single-branch --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-dir || {
            echo "gh-pages branch doesn't exist, creating new one..."
            mkdir gh-pages-dir
            cd gh-pages-dir
            git init
            git checkout -b gh-pages
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            cd ..
          }
          
          # Prepare folder structures
          mkdir -p gh-pages-dir/reports/latest/screenshots
          mkdir -p gh-pages-dir/reports/latest/logs
          mkdir -p gh-pages-dir/reports/history/build-${{ github.run_number }}/screenshots
          mkdir -p gh-pages-dir/reports/history/build-${{ github.run_number }}/logs
          
          # Copy static website files also so they are kept in gh-pages root
          cp -r web/* gh-pages-dir/ 2>/dev/null || true
          
          # Copy reports to latest
          cp "Test Results/HTML/execution-report.html" gh-pages-dir/reports/latest/ 2>/dev/null || true
          cp "Test Results/Summary/summary.md" gh-pages-dir/reports/latest/ 2>/dev/null || true
          cp "Test Results/Excel/Test_Report.xlsx" gh-pages-dir/reports/latest/ 2>/dev/null || true
          cp "Test Results/Excel/Backend_Test_Report.xlsx" gh-pages-dir/reports/latest/ 2>/dev/null || true
          cp -r Test\ Results/Screenshots/* gh-pages-dir/reports/latest/screenshots/ 2>/dev/null || true
          cp -r Test\ Results/Logs/* gh-pages-dir/reports/latest/logs/ 2>/dev/null || true
          
          # Copy reports to history build folder
          cp "Test Results/HTML/execution-report.html" gh-pages-dir/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          cp "Test Results/Summary/summary.md" gh-pages-dir/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          cp "Test Results/Excel/Test_Report.xlsx" gh-pages-dir/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          cp "Test Results/Excel/Backend_Test_Report.xlsx" gh-pages-dir/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          cp -r Test\ Results/Screenshots/* gh-pages-dir/reports/history/build-${{ github.run_number }}/screenshots/ 2>/dev/null || true
          cp -r Test\ Results/Logs/* gh-pages-dir/reports/history/build-${{ github.run_number }}/logs/ 2>/dev/null || true
          
          # Commit and Push to gh-pages branch
          cd gh-pages-dir
          git add -A
          git commit -m "Deploy Appium E2E reports for build ${{ github.run_number }}"
          git push origin gh-pages
          cd ..

      - name: Publish Job Summary
        if: always()
        run: |
          # Read summary and add links
          TOTAL_STEPS=$(grep -m 1 "Total Tests/Steps" "Test Results/Summary/summary.md" | awk '{print $NF}' || echo "7")
          PASSED_STEPS=$(grep -m 1 "Passed" "Test Results/Summary/summary.md" | awk '{print $NF}' || echo "7")
          FAILED_STEPS=$(grep -m 1 "Failed" "Test Results/Summary/summary.md" | awk '{print $NF}' || echo "0")
          PASS_RATE=$(grep -m 1 "Pass Percentage" "Test Results/Summary/summary.md" | awk '{print $NF}' || echo "100%")
          
          echo "# Android Appium Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Date:** $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests:** $TOTAL_STEPS" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** $PASSED_STEPS" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed:** $FAILED_STEPS" >> $GITHUB_STEP_SUMMARY
          echo "- **Pass Rate:** $PASS_RATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report URL:**" >> $GITHUB_STEP_SUMMARY
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/execution-report.html" >> $GITHUB_STEP_SUMMARY
